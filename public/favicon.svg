<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Back Card (Gray) -->
  <rect x="120" y="140" width="272" height="176" rx="24" fill="url(#card2)" transform="rotate(8 256 228)"/>
  
  <!-- Front Card (Green/Blue) -->
  <rect x="100" y="180" width="312" height="192" rx="28" fill="url(#card1)"/>
  
  <!-- Chip -->
  <rect x="140" y="240" width="48" height="32" rx="8" fill="#facc15" opacity="0.9"/>
  
  <!-- Contactless waves -->
  <path d="M 215 242 Q 225 256 215 270" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 230 238 Q 242 256 230 274" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M 245 234 Q 260 256 245 278" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
